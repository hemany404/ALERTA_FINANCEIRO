<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Alertas Financeiros</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at top, #0f172a, #020617);
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #e5e7eb;
    }

    .painel {
        width: 420px;
        max-height: 80vh;
        padding: 20px;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        border-radius: 16px;
        box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
        border: 1px solid rgba(56, 189, 248, 0.2);
        display: flex;
        flex-direction: column;
    }

    h2 {
        margin: 0 0 15px;
        text-align: center;
        font-weight: 600;
        letter-spacing: 1px;
        color: #38bdf8;
    }

    #status {
        text-align: center;
        font-size: 0.85rem;
        margin-bottom: 10px;
        color: #94a3b8;
    }

    #alertas {
        flex: 1;
        overflow-y: auto;
        padding-right: 5px;
    }

    .alerta {
        background: rgba(2, 6, 23, 0.6);
        border-left: 4px solid #22d3ee;
        padding: 10px 12px;
        margin-bottom: 10px;
        border-radius: 8px;
        animation: fadeIn 0.4s ease;
        font-size: 0.9rem;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(8px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    #alertas::-webkit-scrollbar {
        width: 6px;
    }

    #alertas::-webkit-scrollbar-thumb {
        background: #38bdf8;
        border-radius: 10px;
    }
</style>
</head>

<body>

<div class="painel">
    <h2> Alertador de Preços de Cripto</h2>
    <div id="status">Conectando...</div>
    <div id="alertas"></div>
</div>

<script>
const status = document.getElementById("status");
const alertas = document.getElementById("alertas");

const ws = new WebSocket("ws://localhost:8000/ws");

ws.onopen = () => {
    console.log("Conectado!");
    status.textContent = "🟢 Conectado ao servidor";
};

ws.onmessage = (e) => {
    const alerta = document.createElement("div");
    alerta.className = "alerta";
    alerta.textContent = e.data;
    alertas.appendChild(alerta);
    alertas.scrollTop = alertas.scrollHeight;
};

ws.onerror = (e) => {
    console.error("Erro:", e);
    status.textContent = "🔴 Erro na conexão";
};

ws.onclose = () => {
    status.textContent = "🟠 Conexão encerrada";
};
</script>

</body>
</html>
